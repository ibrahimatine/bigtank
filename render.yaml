databases:
  - name: samadal-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: samadal-api
    runtime: node
    nodeVersion: 20.11.0
    region: frankfurt
    plan: free
    branch: main
    repo: https://github.com/ibrahimatine/bigtank
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: corepack enable && corepack prepare pnpm@10.29.3 --activate && pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @samadal/shared-types build && pnpm --filter @samadal/shared-utils build && pnpm --filter @samadal/database build && pnpm --filter api build
    startCommand: cd packages/database && npx prisma migrate deploy && cd /opt/render/project/src && node apps/api/dist/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: samadal-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: ACCESS_TOKEN_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY
        value: 7d
      - key: WEB_URL
        value: https://samadal.net
      - key: CORS_ORIGIN
        value: https://samadal.net,https://www.samadal.net
      - key: EMAIL_FROM
        value: Samadal <noreply@send.samadal.net>
      - key: INTECH_BASE_URL
        value: https://api.intech.sn
      - key: SMS_SENDER_NAME
        value: Samadal
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: INTECH_API_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
