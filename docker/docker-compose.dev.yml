services:
  # ============================================================
  # PostgreSQL 16
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: samadal-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: samadal
      POSTGRES_USER: samadal
      POSTGRES_PASSWORD: samadal_dev_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samadal"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # MinIO (S3-compatible pour les images en dev)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: samadal-minio
    restart: unless-stopped
    ports:
      - "9000:9000"    # API S3
      - "9001:9001"    # Console web
    environment:
      MINIO_ROOT_USER: samadal_minio
      MINIO_ROOT_PASSWORD: samadal_minio_secret
      MINIO_CORS_ALLOW_ORIGIN: http://localhost:3000
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Créer le bucket automatiquement au démarrage
  minio-setup:
    image: minio/mc:latest
    container_name: samadal-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 samadal_minio samadal_minio_secret;
      mc mb local/samadal-images --ignore-existing;
      mc anonymous set download local/samadal-images;
      echo 'Bucket samadal-images created and configured';
      "

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
